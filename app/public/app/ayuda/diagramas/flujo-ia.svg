t-baseline="middle">2</text><text x="462.5" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#23245D" text-anchor="middle" dominant-baseline="middle">Atenea propone</text><text x="462.5" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#7B7C9E" text-anchor="middle" dominant-baseline="middle">Escribe un borrador</text><text x="462.5" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#7B7C9E" text-anchor="middle" dominant-baseline="middle">con lo que sabe de la clase</text><path d="M598 130 H609" stroke="#B2B2C6" stroke-width="4" stroke-linecap="round"/><path d="M607 121 L622 130 L607 139" stroke="#B2B2C6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="630" y="30" width="255" height="200" rx="20" fill="#FFFFFF" stroke="#FFDE92" stroke-width="3"/><rect x="630" y="30" width="255" height="8" rx="4" fill="#FFC338"/><circle cx="757.5" cy="76" r="20" fill="#FFEAB9"/><text x="757.5" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#23245D" text-anchor="middle" dominant-baseline="middle">3</text><text x="757.5" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#23245D" text-anchor="middle" dominant-baseline="middle">Tú lo revisas</text><text x="757.5" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#7B7C9E" text-anchor="middle" dominant-baseline="middle">Cambias lo que quieras</text><text x="757.5" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#7B7C9E" text-anchor="middle" dominant-baseline="middle">antes de nada</text><path d="M893 130 H904" stroke="#B2B2C6" stroke-width="4" stroke-linecap="round"/><path d="M902 121 L917 130 L902 139" stroke="#B2B2C6" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/><rect x="925" y="30" width="255" height="200" rx="20" fill="#FFFFFF" stroke="#AEF8D3" stroke-width="3"/><rect x="925" y="30" width="255" height="8" rx="4" fill="#6CF3AF"/><circle cx="1052.5" cy="76" r="20" fill="#CCFBE3"/><text x="1052.5" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#23245D" text-anchor="middle" dominant-baseline="middle">4</text><text x="1052.5" y="120" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="700" fill="#23245D" text-anchor="middle" dominant-baseline="middle">Se guarda</text><text x="1052.5" y="154" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#7B7C9E" text-anchor="middle" dominant-baseline="middle">Solo si le das a guardar</text><text x="1052.5" y="180" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="500" fill="#7B7C9E" text-anchor="middle" dominant-baseline="middle">tú</text><text x="600" y="264" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="19" font-weight="700" fill="#65668E" text-anchor="middle" dominant-baseline="middle">La IA nunca publica nada por su cuenta ni cambia las notas</text></svg>